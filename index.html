	<!-- 네비게이션 스크롤 효과 (ABOUT 섹션의 CI 이미지 보일 때만 로고 숨김) -->
	<script>
		(function() {
			const logo = document.querySelector('#header .logo');
			const ciImage = document.querySelector('#page2 img[alt="LiTRAIL"]');

			// IntersectionObserver로 CI 이미지 감지
			const observer = new IntersectionObserver(function(entries) {
				entries.forEach(function(entry) {
					// CI 이미지가 화면에 보이면 로고 숨김
					if (entry.isIntersecting) {
						logo.classList.add('hidden');
					} else {
						logo.classList.remove('hidden');
					}
				});
			}, {
				threshold: 0.1 // 이미지의 10%가 보이면 감지
			});

			// CI 이미지 관찰 시작
			if (ciImage) {
				observer.observe(ciImage);
			}
		})();
	</script>

			// scrolly 링크의 기본 속도를 빠르게 설정 (기본값의 절반)
			$('.scrolly').scrolly({
				speed: 500  // 기본 1000ms에서 500ms로 변경 (2배 빠름)
			});
		});
	</script>

	<!-- More 버튼 fade out 효과 (다음 페이지가 5% 이상 보이면 서서히 사라짐) -->
	<script>
		(function() {
			// 각 섹션과 more 버튼 매핑
			const sections = [
				{ section: document.querySelector('#banner'), nextSection: document.querySelector('#page2'), moreButton: document.querySelector('#banner .more') },
				{ section: document.querySelector('#page2'), nextSection: document.querySelector('#page3'), moreButton: document.querySelector('#page2 .more') },
				{ section: document.querySelector('#page3'), nextSection: document.querySelector('#contact'), moreButton: document.querySelector('#page3 .more') }
			];

			// IntersectionObserver 설정 (다음 섹션이 5% 이상 보이는지 감지)
			const observerOptions = {
				threshold: 0.05 // 5% 이상 보일 때 감지
			};

			sections.forEach(function(item) {
				if (item.nextSection && item.moreButton) {
					const observer = new IntersectionObserver(function(entries) {
						entries.forEach(function(entry) {
							// 다음 섹션이 5% 이상 보이면 현재 섹션의 more 버튼을 서서히 숨김
							if (entry.isIntersecting) {
								item.moreButton.classList.add('fading');
							} else {
								item.moreButton.classList.remove('fading');
							}
						});
					}, observerOptions);

					// 다음 섹션 관찰 시작
					observer.observe(item.nextSection);
				}
			});
		})();
	</script>

	<!-- 모바일 메뉴 토글 스크립트 -->
	<script>
		$(function() {
			const mobileMenuBtn = $('#mobile-menu-btn');
			const mobileMenuOverlay = $('#mobile-menu-overlay');
			const mobileMenuLinks = $('.mobile-menu-link');

			// 햄버거 버튼 클릭
			mobileMenuBtn.on('click', function() {
				mobileMenuOverlay.toggleClass('active');
			});

			// 오버레이 배경(딤드) 클릭 시 닫기
			mobileMenuOverlay.on('click', function(e) {
				if (e.target === this) {
					mobileMenuOverlay.removeClass('active');
				}
			});

			// 메뉴 링크 클릭 시 오버레이 닫기
			mobileMenuLinks.on('click', function() {
				mobileMenuOverlay.removeClass('active');
			});
		});
	</script>

	<!-- YouTube 모달 제어 -->
	<script>
		$(function() {
			const playButton = $('#playButton');
			const videoModal = $('#videoModal');
			const closeButton = $('#closeButton');
			const youtubeIframe = $('#youtubeIframe');
			const videoUrl = 'https://www.youtube.com/embed/UGiMFrFhD8c?si=jU9Fv3Rp8J6dxM6Q&autoplay=1';

			// 플레이 버튼 클릭 시 모달 열기
			playButton.on('click', function() {
				youtubeIframe.attr('src', videoUrl);
				videoModal.addClass('active');
			});

			// 닫기 버튼 클릭 시 모달 닫기
			closeButton.on('click', function() {
				videoModal.removeClass('active');
				youtubeIframe.attr('src', '');
			});

			// 모달 배경 클릭 시 닫기
			videoModal.on('click', function(e) {
				if (e.target === this) {
					videoModal.removeClass('active');
					youtubeIframe.attr('src', '');
				}
			});

			// ESC 키로 모달 닫기
			$(document).on('keydown', function(e) {
				if (e.key === 'Escape' && videoModal.hasClass('active')) {
					videoModal.removeClass('active');
					youtubeIframe.attr('src', '');
				}
			});
		});
	</script>
	</body>
</html>
