<!DOCTYPE html>
<html>
<head>
    <title>Light Trail</title>
    <!-- 모바일 뷰포트 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /* html, body에 100% 높이와 overflow:hidden 적용 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #22272a;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            /* 화면에 꽉 차되 넘치지 않도록 */
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img src="CI_A_Color.png" alt="Light Trail">
</body>
</html>
